name: Import 26.3 source

on:
  push:
    branches:
      - 26.3

permissions:
  contents: write

jobs:
  import:
    if: "!contains(github.event.head_commit.message, '[imported-26.3]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 26.3

      - name: Extract source
        run: |
          rm -rf /tmp/immersivepaintings
          mkdir -p /tmp/immersivepaintings
          unzip -q ImmersivePaintings-26.zip -d /tmp/immersivepaintings
          SRC=/tmp/immersivepaintings/ImmersivePaintings-26.2

          cp -a "$SRC"/. .

          rm -f ImmersivePaintings-26.zip
          rm -f .github/workflows/import-26.3.yml

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Import Minecraft 26.3 source [imported-26.3]"
          git push origin 26.3
